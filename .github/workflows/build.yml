name: Build vica-laya runtime

# Builds the vica-laya runner from the ggmlc snapshot in ggmlc/ for three platforms, checks it
# on CPU with the published model, and packs one download per platform: runner + vica-laya.gguf
# + licenses. A `v*` tag also attaches the packages and SHA256SUMS to a GitHub release.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  # Published model release. Pin a Hugging Face commit, not main.
  MODEL_RELEASE: "2026.11.08.1"
  MODEL_URL: https://huggingface.co/tory-labs/vica-laya/resolve/a476161f88e8f91737533595168e85d09dcb8e14/laya_multilingual_q8_0.gguf
  MODEL_SHA256: ba398461a6181e68350d0a88cf7885f53925ce440d2e97f3ea0096e4d8d9a721
  CHECK_FILES: https://huggingface.co/tory-labs/vica-laya/resolve/a476161f88e8f91737533595168e85d09dcb8e14

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # flags: the shipped build. reference_flags: the upstream-style build, kept only to compare
          # answers and CPU speed. Linux and Windows drop OpenMP (libgomp / VCOMP140). Linux links
          # libstdc++ / libgcc statically. Windows keeps the shared MSVC runtime and ships its DLLs
          # next to the exe: a static MSVC runtime changed CPU probabilities by up to 0.032.
          - name: macos-arm64
            os: macos-15
            flags: -DGGMLC_ENABLE_METAL=ON -DGGML_NATIVE=OFF
            reference_flags: ""
          - name: linux-x86_64
            os: ubuntu-22.04
            flags: -DGGMLC_ENABLE_VULKAN=ON -DGGML_OPENMP=OFF "-DCMAKE_EXE_LINKER_FLAGS=-static-libstdc++ -static-libgcc"
            reference_flags: -DGGMLC_ENABLE_VULKAN=ON
          - name: windows-x86_64
            os: windows-2022
            flags: -DGGMLC_ENABLE_VULKAN=ON -DGGML_OPENMP=OFF
            reference_flags: -DGGMLC_ENABLE_VULKAN=ON

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ninja
        uses: ashutoshvarma/setup-ninja@master

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Vulkan SDK (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/lunarg-vulkan.gpg
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo apt-get update -y
          sudo apt-get install -y build-essential vulkan-sdk libssl-dev

      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        env:
          VULKAN_VERSION: 1.4.357.0
        run: |
          curl.exe -o $env:RUNNER_TEMP/VulkanSDK-Installer.exe -L "https://sdk.lunarg.com/sdk/download/${env:VULKAN_VERSION}/windows/vulkansdk-windows-X64-${env:VULKAN_VERSION}.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\${env:VULKAN_VERSION}"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\${env:VULKAN_VERSION}\bin"

      - name: Configure
        run: cmake -S ggmlc -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGGMLC_BUILD_EXAMPLES=ON ${{ matrix.flags }}

      - name: Build
        run: cmake --build build --config Release --target laya

      - name: Configure reference
        if: matrix.reference_flags != ''
        run: cmake -S ggmlc -B build-ref -G Ninja -DCMAKE_BUILD_TYPE=Release -DGGMLC_BUILD_EXAMPLES=ON ${{ matrix.reference_flags }}

      - name: Build reference
        if: matrix.reference_flags != ''
        run: cmake --build build-ref --config Release --target laya

      - name: Name the binary vica-laya
        shell: bash
        run: |
          mkdir -p out
          if [ -f build/examples/laya/laya.exe ]; then
            cp build/examples/laya/laya.exe out/vica-laya.exe; echo "EXE=out/vica-laya.exe" >> "$GITHUB_ENV"
            [ -f build-ref/examples/laya/laya.exe ] && echo "REF=build-ref/examples/laya/laya.exe" >> "$GITHUB_ENV"
          else
            cp build/examples/laya/laya out/vica-laya; echo "EXE=out/vica-laya" >> "$GITHUB_ENV"
            [ -f build-ref/examples/laya/laya ] && echo "REF=build-ref/examples/laya/laya" >> "$GITHUB_ENV"
          fi
          true

      - name: Show linked libraries
        continue-on-error: true
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) ldd "$EXE" ;;
            macOS) otool -L "$EXE" ;;
            Windows) dumpbin //dependents "$EXE" ;;
          esac

      - name: CPU check with the published model
        shell: bash
        run: |
          mkdir -p check
          curl -sSL -o check/model.gguf "$MODEL_URL"
          echo "$MODEL_SHA256  check/model.gguf" | sha256sum -c - 2>/dev/null || echo "$MODEL_SHA256  check/model.gguf" | shasum -a 256 -c -
          curl -sSL -o check/example-state.json "$CHECK_FILES/example-state.json"
          curl -sSL -o check/topic-questions.json "$CHECK_FILES/topic-questions.json"
          python scripts/check_runtime.py "$EXE" check/model.gguf check/example-state.json check/topic-questions.json \
            "check/check-${{ matrix.name }}.json" ${REF:+--reference "$REF"}

      - name: Add MSVC runtime DLLs (Windows)
        if: runner.os == 'Windows'
        run: |
          $crt = Get-ChildItem "$env:VCToolsRedistDir\x64" -Directory -Filter "Microsoft.VC*.CRT" | Select-Object -First 1
          Copy-Item "$($crt.FullName)\msvcp140.dll", "$($crt.FullName)\vcruntime140.dll", "$($crt.FullName)\vcruntime140_1.dll" out\
          Get-ChildItem out

      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.name }}
          path: out/*

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-${{ matrix.name }}
          path: check/check-*.json

  package:
    name: Package vica-laya
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          pattern: runtime-*
          path: runtime

      - name: Rename the model to vica-laya
        run: |
          pip install gguf==0.19.0
          curl -sSL -o original.gguf "$MODEL_URL"
          echo "$MODEL_SHA256  original.gguf" | sha256sum -c -
          python scripts/rename_gguf.py original.gguf vica-laya.gguf "tory-labs/vica-laya@$MODEL_RELEASE"
          curl -sSL -o LICENSE "$CHECK_FILES/LICENSE"
          curl -sSL -o NOTICE "$CHECK_FILES/NOTICE"

      - name: Check the renamed model with the Linux runner
        run: |
          chmod +x runtime/runtime-linux-x86_64/vica-laya
          curl -sSL -o state.json "$CHECK_FILES/example-state.json"
          curl -sSL -o questions.json "$CHECK_FILES/topic-questions.json"
          for m in original vica-laya; do
            runtime/runtime-linux-x86_64/vica-laya decide $m.gguf --json --device cpu --state-file state.json --questions-file questions.json > $m.json
          done
          python - <<'PY'
          import json
          a, b = (json.load(open(f)) for f in ("original.json", "vica-laya.json"))
          assert a["answers"] == b["answers"], "answers changed"
          assert b["model"] == "vica-laya", b["model"]
          print("renamed model: same answers, model =", b["model"])
          PY

      - name: Pack one download per platform
        run: |
          mkdir dist
          for p in macos-arm64 linux-x86_64 windows-x86_64; do
            d=pack/$p/vica-laya
            mkdir -p $d
            cp runtime/runtime-$p/* $d/
            ln vica-laya.gguf $d/vica-laya.gguf
            cp LICENSE NOTICE licenses/THIRD_PARTY_LICENSES.txt $d/
            if [ $p = windows-x86_64 ]; then
              (cd pack/$p && zip -r -X ../../dist/vica-laya-$p.zip vica-laya)
            else
              chmod +x $d/vica-laya
              tar -czf dist/vica-laya-$p.tar.gz -C pack/$p vica-laya
            fi
          done
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS && ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: vica-laya
          path: dist/*

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/*
